# Every push to master: check, build installers for Windows, macOS and Linux, and publish them as the latest GitHub
# release (v<version>-build.<run>), so /releases/latest always has the newest build. Pushing a tag like v1.2.0
# publishes a release with that version instead.
name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Lifecycle scripts are off (.npmrc); `setup` fetches Electron and node-datachannel's prebuilt binary for
      # this OS/arch explicitly.
      - run: npm ci
      - run: npm run setup
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version")-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
      - name: Package
        env:
          # No signing certificates yet: build unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never -c.extraMetadata.version=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: chomusuke-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            flags=(--title "Chomusuke ${GITHUB_REF_NAME#v}")
          else
            version="$(ls dist | sed -nE 's/^Chomusuke-(.+)-(win|mac|linux)-.*/\1/p' | head -n1)"
            tag="v${version}"
            flags=(--latest --title "Chomusuke ${version}" --target "$GITHUB_SHA")
          fi
          gh release create "$tag" dist/* --generate-notes "${flags[@]}"
